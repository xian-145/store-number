<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密碼自動計算器</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;font-family:Arial,"Noto Sans TC",sans-serif;background:#f2f7fc;display:flex;justify-content:center;align-items:center}.card{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:28px 24px;box-shadow:0 8px 30px #0002}h1{text-align:center;margin:0 0 8px;color:#0670aa;font-size:26px}.sub{text-align:center;color:#777;font-size:14px;margin-bottom:24px}label{display:block;font-weight:bold;margin:16px 0 7px}input{width:100%;padding:14px;border:2px solid #d8e4ee;border-radius:10px;font-size:20px;text-align:center;outline:0}input:focus{border-color:#08c}.date{display:flex;gap:10px}.date div{flex:1;background:#f5f8fb;border-radius:10px;padding:12px;text-align:center}.date small{display:block;color:#888;font-size:12px;margin-bottom:4px}.date strong{font-size:20px}button{width:100%;border:0;border-radius:11px;padding:15px;margin-top:22px;background:#0780bd;color:#fff;font-size:18px;font-weight:bold}.result{margin-top:22px;padding:20px;background:#eef8ff;border-radius:14px;text-align:center}.title{color:#666;font-size:14px}#password{margin:8px 0;font-size:42px;letter-spacing:7px;font-weight:bold;color:#0670aa}.copy{background:#28a745;margin-top:12px;font-size:15px;padding:11px}.error{color:#d93025;text-align:center;margin-top:12px;font-size:14px;display:none}</style></head><body><div class="card"><h1>🔐 密碼自動計算器</h1><div class="sub">輸入店編即可自動依當年月計算</div><label for="store">店編</label><input id="store" maxlength="4" placeholder="請輸入店編" autocomplete="off" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"><label>系統自動判斷日期</label><div class="date"><div><small>民國年</small><strong id="year">---</strong></div><div><small>月份</small><strong id="month">--</strong></div></div><button onclick="calc()">計算密碼</button><div class="error" id="error"></div><div class="result"><div class="title">計算結果｜後四位密碼</div><div id="password">----</div><button class="copy" onclick="copyPwd()">📋 複製密碼</button></div></div><script>function dateInfo(){let d=new Date(),y=d.getFullYear()-1911,m=d.getMonth()+1;year.textContent=y;month.textContent=m;return[y,m]}function calc(){let s=store.value.trim();error.style.display="none";if(!/^[A-Z]\d{3}$|^\d{4}$/.test(s)){error.textContent="請輸入4碼店編，第一碼可為英文字母，最後3碼須為數字。";error.style.display="block";return}let[y,m]=dateInfo(),n=Number(s.slice(-3))*1997+8800+y*m;password.textContent=String(n%10000).padStart(4,"0")}function copyPwd(){let v=password.textContent;if(/^\d{4}$/.test(v))navigator.clipboard.writeText(v).then(()=>{let b=document.querySelector(".copy"),t=b.textContent;b.textContent="✅ 已複製";setTimeout(()=>b.textContent=t,1200)})}dateInfo();setInterval(dateInfo,60000)</script></body></html>
